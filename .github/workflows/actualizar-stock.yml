name: Actualizar stock, SEO, imágenes y Meta

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-stock-seo-imagenes
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Instalar procesador de imágenes
        run: npm install --no-save --no-package-lock sharp@0.34.3

      - name: Sincronizar stock, imágenes, SEO y catálogo de Meta
        run: node scripts/actualizar-stock.mjs

      - name: Preservar URLs históricas que ya no estén en la hoja
        run: node scripts/preserve-sold-vehicle-pages.mjs

      - name: Guardar cambios
        shell: bash
        run: |
          git add -A \
            data/stock.json \
            data/image-sync.json \
            index.html \
            meta-catalog.csv \
            robots.txt \
            sitemap.xml \
            vehiculos/ \
            img/meta/ \
            img/vehiculos/

          if git diff --cached --quiet; then
            echo "No hubo cambios para publicar."
            exit 0
          fi

          git config user.name "lmp-stock-bot"
          git config user.email "actions@users.noreply.github.com"

          git commit -m "chore: actualizar stock, SEO e imágenes"
          git push
