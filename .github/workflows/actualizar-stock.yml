name: Actualizar stock y SEO desde Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-stock-seo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Generar stock, HTML SEO y sitemap
        run: node scripts/actualizar-stock.mjs

      - name: Guardar cambios
        shell: bash
        run: |
          git add -A data/stock.json index.html robots.txt sitemap.xml vehiculos/

          if git diff --cached --quiet; then
            echo "No hubo cambios para publicar."
            exit 0
          fi

          git config user.name "lmp-stock-bot"
          git config user.email "actions@users.noreply.github.com"

          git commit -m "chore: actualizar stock y SEO desde Google Sheets"
          git push
