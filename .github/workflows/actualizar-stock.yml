name: Actualizar stock desde Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-stock
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar data/stock.json
        run: node scripts/actualizar-stock.mjs

      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet -- data/stock.json; then
            echo "No hubo cambios de stock."
            exit 0
          fi

          git config user.name "lmp-stock-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/stock.json
          git commit -m "chore: actualizar stock desde Google Sheets"
          git push
